Service:
  RegionId: cn-hangzhou
  DeployType: ros
  OperationMetadata:
    StatusOperationConfigs:
    - TemplateName: ECS单机版
      SupportOperations:
      - Start
      - Stop
      - Restart
    SupportBackup: true
    ModifyParametersConfig:
    - TemplateName: ECS单机版
      Operation:
      - Name: 变更ECS实例规格
        Description: 变更ECS实例规格
        Type: Custom
        Parameters:
        - EcsInstanceType
      - Name: 变更ECS实例密码
        Description: 变更ECS实例密码
        Type: Custom
        Parameters:
        - InstancePassword
  UpgradeMetadata:
    Description: 升级
    SupportUpgradeFromVersions: []
    SupportRollback: true
    UpgradeComponents:
    - Configuration
    - Resource
  DeployMetadata:
    SupplierDeployMetadata:
      RoleName:
      UserType: Aliyun
      SupplierTemplateConfigs:
      - Name: ECS单机版
        Url: 'ros_templates/template.yaml'
        ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
        AllowedRegions:
        - ap-southeast-1
        PredefinedParameters: []
        HiddenParameterKeys:
        - VpcId
        - VSwitchId
        - ZoneId
        ParameterMappings:
        - ParameterKey: RegionId
          ParameterMappingKeys:
          - VpcId
          - ZoneId
          - VSwitchId
          ParameterValueMapping:
            ap-southeast-1:
              Parameters:
                VpcId: vpc-t4nd2jonug8p1vuc6uxh8
                ZoneId: ap-southeast-1a
                VSwitchId: vsw-t4nwtn5ll1w8wj51jrsai
      ArtifactRelation:
        ecs_image_firecrawl:
          ArtifactId: ${Artifact.EcsImage.ArtifactId}
          ArtifactVersion: draft
    TemplateConfigs:
    - Name: ECS单机版
      Url: 'ros_templates/template.yaml'
      ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
      AllowedRegions:
      - ap-southeast-1
  ServiceType: managed
  ServiceInfo:
    # 英文版可以再配置Locale为en-US的服务信息
  - Locale: zh-CN
    Name: firecrawl-xjp
    ShortDescription: Service description
    Image: 
      https://service-info-public.oss-cn-hangzhou.aliyuncs.com/1853370294850618/service-image/bfd30cc4-e959-4093-b5cb-77a05058b911.png
    Softwares: []
Artifact:
  EcsImage:
    ArtifactType: EcsImage
    ArtifactName: ecs_image_firecrawl
    Description: firecrawl EcsImage
    SupportRegionIds:
    - ap-southeast-1
    ArtifactBuildProperty:
      CodeRepo:
        Platform: github
        Owner: YunyunZhai
        RepoName: YunyunZhai/firecrawl
        Branch: main
      RegionId: ap-southeast-1
      CommandType: RunShellScript
      SystemDiskSize: 40
      CommandContent: |-
        mkdir -p /root/application
        if [ -e "/root/code/.env" ]; then cp -r "/root/code/.env" "/root/application/"; fi
        if [ -e "/root/code/docker-compose.yaml" ]; then cp -r "/root/code/docker-compose.yaml" "/root/application/"; fi
        mkdir -p "/root/application/apps"
        if [ -e "/root/code/apps/api" ]; then cp -r "/root/code/apps/api" "/root/application/apps/"; fi
        if [ -e "/root/code/apps/nuq-postgres" ]; then cp -r "/root/code/apps/nuq-postgres" "/root/application/apps/"; fi
        if [ -e "/root/code/apps/playwright-service-ts" ]; then cp -r "/root/code/apps/playwright-service-ts" "/root/application/apps/"; fi
        cd /root/application
        sed -i 's/pull_policy: always/pull_policy: if_not_present/g' docker-compose.yaml
        docker compose -f docker-compose.yaml build 
        docker compose -f docker-compose.yaml pull 2>&1 | stdbuf -oL grep -viE 'Downloading|sha256|extracting|KiB|Downloaded' || true;
